services:
  agent-langfuse-otelcol:
    image: otel/opentelemetry-collector:latest
    container_name: agent-langfuse-otelcol
    restart: unless-stopped
    command: ["--config", "/etc/otelcol/config.yaml"]
    ports:
      - "4318:4318"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./collector-single-port.docker.yaml:/etc/otelcol/config.yaml:ro
    environment:
      LANGFUSE_AUTH_HEADER_OPENCODE: "${LANGFUSE_COLLECTOR_AUTH_HEADER_OPENCODE}"
      LANGFUSE_AUTH_HEADER_PI: "${LANGFUSE_COLLECTOR_AUTH_HEADER_PI}"
      LANGFUSE_AUTH_HEADER_CLINE: "${LANGFUSE_COLLECTOR_AUTH_HEADER_CLINE}"
      LANGFUSE_AUTH_HEADER_CLAUDECODE: "${LANGFUSE_COLLECTOR_AUTH_HEADER_CLAUDECODE}"
      LANGFUSE_AUTH_HEADER_CODEX: "${LANGFUSE_COLLECTOR_AUTH_HEADER_CODEX}"
      LANGFUSE_OTEL_EXPORTER_ENDPOINT_OPENCODE: "${LANGFUSE_COLLECTOR_EXPORTER_ENDPOINT_OPENCODE}"
      LANGFUSE_OTEL_EXPORTER_ENDPOINT_PI: "${LANGFUSE_COLLECTOR_EXPORTER_ENDPOINT_PI}"
      LANGFUSE_OTEL_EXPORTER_ENDPOINT_CLINE: "${LANGFUSE_COLLECTOR_EXPORTER_ENDPOINT_CLINE}"
      LANGFUSE_OTEL_EXPORTER_ENDPOINT_CLAUDECODE: "${LANGFUSE_COLLECTOR_EXPORTER_ENDPOINT_CLAUDECODE}"
      LANGFUSE_OTEL_EXPORTER_ENDPOINT_CODEX: "${LANGFUSE_COLLECTOR_EXPORTER_ENDPOINT_CODEX}"
