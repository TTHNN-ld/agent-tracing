receivers:
  otlp/claudecode:
    protocols:
      http:
        endpoint: 0.0.0.0:4318

  otlp/codex:
    protocols:
      http:
        endpoint: 0.0.0.0:4319

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 256
    spike_limit_mib: 64

  batch:
    timeout: 2s
    send_batch_size: 256
    send_batch_max_size: 512

exporters:
  otlphttp/langfuse_claudecode:
    endpoint: ${env:LANGFUSE_OTEL_EXPORTER_ENDPOINT_CLAUDECODE}
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER_CLAUDECODE}
      x-langfuse-ingestion-version: "4"

  otlphttp/langfuse_codex:
    endpoint: ${env:LANGFUSE_OTEL_EXPORTER_ENDPOINT_CODEX}
    headers:
      Authorization: ${env:LANGFUSE_AUTH_HEADER_CODEX}
      x-langfuse-ingestion-version: "4"

  debug:
    verbosity: basic

service:
  pipelines:
    traces/claudecode:
      receivers: [otlp/claudecode]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse_claudecode, debug]

    traces/codex:
      receivers: [otlp/codex]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/langfuse_codex, debug]
